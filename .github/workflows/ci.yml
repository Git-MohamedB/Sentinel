name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sentinel/requirements.txt ruff
      - name: Lint with ruff
        run: ruff check --select E4,E7,E9,F --ignore E402,E741 sentinel/
      - name: Syntax check
        run: python -m py_compile sentinel/analyzer.py sentinel/ban_manager.py sentinel/ollama_client.py sentinel/report_generator.py sentinel/sentinel.py sentinel/test_analyzer.py
      - name: Run unit tests
        run: python sentinel/test_analyzer.py -v
      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
