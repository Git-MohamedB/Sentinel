name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r sentinel/requirements.txt
      - name: Syntax check
        run: python -m py_compile sentinel/analyzer.py sentinel/ban_manager.py sentinel/ollama_client.py sentinel/report_generator.py sentinel/sentinel.py sentinel/test_analyzer.py
      - name: Run regex analyzer tests
        run: python sentinel/test_analyzer.py
